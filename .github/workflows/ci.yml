name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # O node --test abre um processo por núcleo; no PC do Pedro isso pesa no limite de memória do WSL.
      - name: Contraste, dist em dia, cópia e modo escuro
        if: runner.environment == 'github-hosted'
        run: npm test
      - name: Contraste, dist em dia, cópia e modo escuro (concorrência limitada)
        if: runner.environment != 'github-hosted'
        run: npm test -- --test-concurrency=2
